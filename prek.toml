# prek pre-commit configuration — https://prek.j178.dev
#
# The local/system hooks below invoke the project's OWN pinned tools (ruff/
# mypy/clang-format from uv.lock) and run CONTRIBUTING.md's documented lint
# commands verbatim, so they can never drift from what CI or a developer's
# shell sees. prek installs nothing of its own for them — "system" language
# just execs whatever `uv run` resolves.
#
# check-case-conflict/check-merge-conflict/check-toml/check-yaml run from
# prek's builtin implementations (no external repo clone needed). debug-
# statements and name-tests-test are Python-specific checks that only exist
# in pre-commit-hooks, so those two stay sourced from that repo.
#
# Run all checks manually: `uv run prek run --all-files`
# Install the git hooks:   `uv run prek install`

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-case-conflict" },
    { id = "check-merge-conflict", exclude = "\\.rst$" },
    { id = "check-toml" },
    { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "debug-statements"

[[repos.hooks]]
id = "name-tests-test"
args = ["--pytest-test-first"]
exclude = "^tests/pdfa_samples\\.py$"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format (check)"
language = "system"
entry = "uv run ruff format --check src tests"
types = ["python"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run ruff check src tests"
types = ["python"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "mypy"
name = "mypy"
language = "system"
entry = "uv run python -m mypy src"
types = ["python"]
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "clang-format"
name = "clang-format (check)"
language = "system"
entry = "uv run clang-format --dry-run --Werror"
files = "^src/.*\\.(cpp|h|hpp)$"

# Private data members are named with a trailing underscore, which makes
# this-> unnecessary. This catches the this-> half of that convention; nothing
# here checks the names themselves.
[[repos.hooks]]
id = "cpp-no-this-arrow"
name = "C++: member_ rather than this->member"
language = "pygrep"
entry = "this->"
files = "^src/.*\\.(cpp|h|hpp)$"

# Bindings registered through locked_class_ hold the lock of every Pdf they
# touch (see src/core/locked_bindings.h). Files that have been converted are
# listed here so that a plain py::class_ cannot come back into them. The files
# not listed bind classes that hold no Pdf state.
[[repos.hooks]]
id = "cpp-locked-class"
name = "C++: locked_class_ rather than py::class_"
language = "pygrep"
entry = "py::class_<"
files = "^src/core/(acroform|annotation|embeddedfiles|job|matrix|namepath|nametree|numbertree|object|object_arithmetic|object_methods|page|parsers|qpdf|qpdf_pagelist|rectangle|tokenfilter|traversal)\\.cpp$"
